name: Validar aplicação
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: restaurante
          POSTGRES_PASSWORD: teste_ci
          POSTGRES_DB: restaurante
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U restaurante"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://restaurante:teste_ci@127.0.0.1:5432/restaurante
      DIRECT_URL: postgresql://restaurante:teste_ci@127.0.0.1:5432/restaurante
      TEST_DATABASE_URL: postgresql://restaurante:teste_ci@127.0.0.1:5432/restaurante_test
      APP_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:deploy
      - name: Criar banco isolado
        run: node --input-type=module -e 'import {Client} from "pg"; const c=new Client({connectionString:process.env.DATABASE_URL}); await c.connect(); await c.query("CREATE DATABASE restaurante_test"); await c.end();'
      - run: node scripts/db-test-prepare.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_PRODUCTION: "true"
